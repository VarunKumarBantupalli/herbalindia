<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Search Feature</title>
    <link rel="stylesheet" href="style.css"> <!-- Optional styling -->
</head>
<body>
    <div id="voice-search-section">
        <input type="text" id="search-bar" placeholder="Search for plants..." disabled>
        <button id="voice-search-btn">
            🎤 Start Voice Search
        </button>
        <button id="stop-search-btn">
            🛑 Stop Voice Search
        </button>
    </div>
    <div id="result-section">
        <!-- Results will be displayed here -->
    </div>
    <script src="voice-search.js"></script>
</body>
</html>
